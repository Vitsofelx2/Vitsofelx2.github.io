<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Finanzas</title>
  <meta name="description" content="Administra tu dinero: ingresos, gastos, presupuestos, metas de ahorro, deudas y más.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="lock" class="lock hidden">
    <div class="lock-box">
      <div class="lock-logo">💰</div>
      <h2>Mis Finanzas</h2>
      <p>Introduce tu PIN</p>
      <input id="lock-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <button id="lock-btn" class="btn primary">Desbloquear</button>
      <p id="lock-err" class="danger-text"></p>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span>💰</span> Mis Finanzas</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost small" id="install-btn" hidden>📲 Instalar app</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menú">☰</button>
        <h1 id="view-title">Inicio</h1>
        <div class="month-picker" id="month-picker">
          <button class="icon-btn" data-month="-1" aria-label="Mes anterior">‹</button>
          <span id="month-label"></span>
          <button class="icon-btn" data-month="1" aria-label="Mes siguiente">›</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
    <button class="fab" id="fab" aria-label="Agregar movimiento">+</button>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="icon-btn" id="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
